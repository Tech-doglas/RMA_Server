server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Storage contains private photos, backups and the session key. Serve photos through the authenticated API only.
    location = /files { return 403; }
    location ^~ /files/ { return 403; }
    location ~ /\. { deny all; }

    # ✅ React router support (fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
